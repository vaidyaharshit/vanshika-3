services:
  - type: web
    name: payflow-payroll-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      # To enable persistent SQLite storage on Render Paid/Starter plans,
      # attach a disk and uncomment the disk section below:
      # - key: DATABASE_PATH
      #   value: /var/data/payflow.db
    # disk:
    #   name: payflow-data
    #   mountPath: /var/data
    #   sizeGB: 1
